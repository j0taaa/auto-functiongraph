name: Emergency Tailscale Recovery

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: autofg
    timeout-minutes: 10
    env:
      HUAWEICLOUD_REGION: ${{ secrets.HUAWEICLOUD_REGION }}
      HUAWEICLOUD_PROJECT_ID: ${{ secrets.HUAWEICLOUD_PROJECT_ID }}
      HUAWEICLOUD_ACCESS_KEY: ${{ secrets.HUAWEICLOUD_ACCESS_KEY }}
      HUAWEICLOUD_SECRET_KEY: ${{ secrets.HUAWEICLOUD_SECRET_KEY }}
      HUAWEICLOUD_SECURITY_TOKEN: ${{ secrets.HUAWEICLOUD_SECURITY_TOKEN }}
    steps:
      - name: Install Huawei Cloud SDK
        run: python -m pip install --disable-pip-version-check --quiet huaweicloudsdkecs huaweicloudsdkcoc

      - name: Start tailscaled through COC
        shell: bash
        run: |
          python - <<'PY'
          import os
          import time
          from huaweicloudsdkcore.auth.credentials import BasicCredentials, GlobalCredentials
          from huaweicloudsdkecs.v2 import EcsClient, ListServersDetailsRequest
          from huaweicloudsdkecs.v2.region.ecs_region import EcsRegion
          from huaweicloudsdkcoc.v1 import (
              CocClient, CreateScriptRequest, DeleteScriptRequest,
              ExecuteScriptRequest, GetScriptJobBatchRequest,
              AddScriptModel, ScriptPropertiesModel, ScriptExecuteParam,
              ExecuteResourceInstance, ExecuteInstancesBatchInfo, ScriptExecuteModel,
          )
          from huaweicloudsdkcoc.v1.region.coc_region import CocRegion

          ak = os.environ["HUAWEICLOUD_ACCESS_KEY"]
          sk = os.environ["HUAWEICLOUD_SECRET_KEY"]
          region = os.environ["HUAWEICLOUD_REGION"]
          project_id = os.environ["HUAWEICLOUD_PROJECT_ID"]
          token = os.environ.get("HUAWEICLOUD_SECURITY_TOKEN", "")

          basic = BasicCredentials(ak, sk, project_id)
          global_creds = GlobalCredentials(ak, sk)
          if token:
              basic = basic.with_security_token(token)
              global_creds = global_creds.with_security_token(token)

          ecs = EcsClient.new_builder().with_credentials(basic).with_region(EcsRegion.value_of(region)).build()
          response = ecs.list_servers_details(ListServersDetailsRequest(limit=1000))
          target = None
          for server in response.servers or []:
              addresses = []
              for group in (server.addresses or {}).values():
                  addresses.extend(getattr(item, "addr", "") for item in (group or []))
              if "119.8.87.166" in addresses or server.name == "huawei-vps":
                  target = server
                  print(f"matched_server={server.name} id={server.id} status={server.status}")
                  break
          if target is None:
              raise SystemExit("Target ECS with public IP 119.8.87.166 was not found")

          coc = CocClient.new_builder().with_credentials(global_creds).with_region(CocRegion.value_of(region)).build()
          script_uuid = None
          script_name = "emergency_tailscale_recovery_20260906"
          script = r'''#!/bin/bash
          set -u
          echo "recovery_start=$(date --iso-8601=seconds)"
          if pgrep -x tailscaled >/dev/null 2>&1; then
            echo "tailscaled already running"
            exit 0
          fi
          if command -v systemctl >/dev/null 2>&1; then
            systemctl start tailscaled.service || true
          fi
          if ! pgrep -x tailscaled >/dev/null 2>&1 && command -v service >/dev/null 2>&1; then
            service tailscaled start || true
          fi
          sleep 3
          pgrep -af '^/usr/sbin/tailscaled' || true
          if ! pgrep -x tailscaled >/dev/null 2>&1; then
            echo "tailscaled failed to start through native service manager" >&2
            exit 1
          fi
          echo "recovery_done=$(date --iso-8601=seconds)"
          '''
          try:
              create = CreateScriptRequest(body=AddScriptModel(
                  name=script_name,
                  type="SHELL",
                  content=script,
                  description="One-time recovery of the existing tailscaled service",
                  properties=ScriptPropertiesModel(risk_level="LOW", version="1.0.0"),
              ))
              script_uuid = coc.create_script(create).data
              print(f"created_script={script_uuid}")

              execute_body = ScriptExecuteModel(
                  execute_param=ScriptExecuteParam(timeout=120, success_rate=100.0, execute_user="root"),
                  execute_batches=[ExecuteInstancesBatchInfo(
                      batch_index=1,
                      target_instances=[ExecuteResourceInstance(
                          resource_id=target.id,
                          region_id=region,
                          provider="ECS",
                          type="CLOUDSERVER",
                      )],
                      rotation_strategy="CONTINUE",
                  )],
              )
              execute_uuid = coc.execute_script(ExecuteScriptRequest(
                  script_uuid=script_uuid,
                  x_project_id=project_id,
                  body=execute_body,
              )).data
              print(f"execution={execute_uuid}")

              terminal = False
              for _ in range(40):
                  time.sleep(5)
                  batch = coc.get_script_job_batch(GetScriptJobBatchRequest(
                      execute_uuid=execute_uuid,
                      batch_index=1,
                      limit=50,
                      x_project_id=project_id,
                  ))
                  instances = getattr(getattr(batch, "data", None), "execute_instances", None) or []
                  statuses = [getattr(item, "status", "") for item in instances]
                  if statuses:
                      print("statuses=" + ",".join(statuses))
                  if instances and all(status in {"FINISHED", "ABNORMAL", "CANCELED", "FAILED"} for status in statuses):
                      for item in instances:
                          print("remote_output=" + str(getattr(item, "message", "")))
                      terminal = True
                      if not all(status == "FINISHED" for status in statuses):
                          raise SystemExit("COC recovery command did not finish successfully")
                      break
              if not terminal:
                  raise SystemExit("Timed out waiting for COC recovery command")
          finally:
              if script_uuid:
                  try:
                      coc.delete_script(DeleteScriptRequest(
                          script_uuid=script_uuid,
                          x_project_id=project_id,
                      ))
                      print("temporary_script_deleted=true")
                  except Exception as exc:
                      print(f"temporary_script_delete_error={type(exc).__name__}")
          PY
